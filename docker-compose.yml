services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: production-ml-platform-app
    ports:
      - "8000:8000"
    environment:
      ML_PLATFORM_CONFIG: configs/development.yaml

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: production-ml-platform-test
    command: ["pytest"]
