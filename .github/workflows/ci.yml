name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and development dependencies
        run: |
          pip install -e ".[dev]"

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src

      - name: Test
        run: pytest

      - name: Build production Docker image
        run: docker build -t production-ml-platform:ci .

      - name: Run Docker tests
        run: docker compose run --rm test

      - name: Start production container
        run: |
          docker run -d \
            --name production-ml-platform-ci \
            -p 8000:8000 \
            -e ML_PLATFORM_CONFIG=configs/production.yaml \
            production-ml-platform:ci

      - name: Runtime smoke test
        run: |
          for attempt in {1..10}; do
            if curl --fail --silent http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs production-ml-platform-ci
          exit 1

      - name: Readiness smoke test
        run: curl --fail --silent http://localhost:8000/ready

      - name: Stop production container
        if: always()
        run: docker rm -f production-ml-platform-ci
